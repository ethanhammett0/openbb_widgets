[project]
name = "revista-mcp-server"
version = "0.1.0"
description = "MCP Server for Revista API"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "openbb-mcp-server>=1.2.1",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
